name: LP Build and Publish SigNoz Image

on:
  push:
    branches:
      - lp/main
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Upstream SigNoz version tag (for example v0.113.0)"
        required: true
        type: string
      lp_patch:
        description: "LP patch suffix number"
        required: true
        default: "1"
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve image metadata
        id: meta
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image_repo="ghcr.io/${owner}/logistics-signoz"

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            upstream_tag="${{ github.event.inputs.upstream_tag }}"
            lp_patch="${{ github.event.inputs.lp_patch }}"
          else
            upstream_tag="$(git describe --tags --abbrev=0 2>/dev/null || echo main)"
            lp_patch="${GITHUB_RUN_NUMBER}"
          fi

          image_tag="${upstream_tag}-lp.${lp_patch}"
          image_ref="${image_repo}:${image_tag}"

          echo "image_repo=${image_repo}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${image_ref}" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc

      - name: Build frontend assets
        shell: bash
        run: |
          corepack enable
          make js-build

      - name: Build community binary
        shell: bash
        run: |
          GOOS=linux GOARCH=amd64 make go-build-community-amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: docker-build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cmd/community/Dockerfile
          push: true
          build-args: |
            TARGETARCH=amd64
          tags: |
            ${{ steps.meta.outputs.image_ref }}
            ${{ steps.meta.outputs.image_repo }}:lp-latest

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.meta.outputs.image_ref }}
          format: spdx-json
          output-file: signoz-image.sbom.spdx.json

      - name: Write digest artifact
        shell: bash
        run: |
          printf '%s\n' "${{ steps.meta.outputs.image_ref }}" > image-reference.txt
          printf '%s\n' "${{ steps.docker-build.outputs.digest }}" > image-digest.txt

      - name: Upload image artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signoz-image-${{ steps.meta.outputs.image_tag }}
          path: |
            image-reference.txt
            image-digest.txt
            signoz-image.sbom.spdx.json
