name: LP Monthly Upstream Sync

on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout lp/main
        uses: actions/checkout@v4
        with:
          ref: lp/main
          fetch-depth: 0

      - name: Configure git
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream main
        shell: bash
        run: |
          git remote add upstream https://github.com/SigNoz/signoz.git
          git fetch upstream main

      - name: Merge upstream into sync branch
        id: merge
        shell: bash
        run: |
          branch="chore/upstream-sync-$(date -u +%Y%m%d)"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"

          git checkout -b "${branch}"

          if ! git merge --no-ff upstream/main -m "chore: sync upstream/main ($(date -u +%Y-%m-%d))"; then
            echo "conflicts=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet origin/lp/main...HEAD; then
            echo "changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "conflicts=false" >> "$GITHUB_OUTPUT"
          echo "changes=true" >> "$GITHUB_OUTPUT"

      - name: Stop on merge conflicts
        if: steps.merge.outputs.conflicts == 'true'
        shell: bash
        run: |
          echo "Upstream sync produced merge conflicts. Manual conflict resolution is required."
          exit 1

      - name: Push sync branch
        if: steps.merge.outputs.changes == 'true'
        shell: bash
        run: |
          git push origin "${{ steps.merge.outputs.branch }}"

      - name: Create pull request
        if: steps.merge.outputs.changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          changes=$(git log --oneline origin/lp/main..HEAD | head -n 20)
          gh pr create \
            --base lp/main \
            --head "${{ steps.merge.outputs.branch }}" \
            --title "chore: monthly upstream sync ($(date -u +%Y-%m-%d))" \
            --body "Automated upstream sync from \`SigNoz/signoz:main\`.

          ## Summary

          This PR merges the latest upstream changes into \`lp/main\` for monthly maintenance.

          ## Top commits

          \`\`\`
          ${changes}
          \`\`\`

          ## Security SLA

          Critical upstream CVE/hotfix changes should be merged within 48 hours."
